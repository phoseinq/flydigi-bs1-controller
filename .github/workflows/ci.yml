name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build app -c Release
      - name: Self-test
        run: |
          $dll = Get-ChildItem app/bin/Release -Recurse -Filter Bs1Cooler.dll | Select-Object -First 1
          dotnet $dll.FullName --selftest
          if ($LASTEXITCODE) { throw "self-test failed ($LASTEXITCODE)" }
