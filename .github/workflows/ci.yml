name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
          - os: ubuntu-latest
            tfm: net10.0
          - os: macos-latest
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build app -c Release -f ${{ matrix.tfm }}
      - name: Self-test
        shell: bash
        run: |
          dll=$(find app/bin/Release/${{ matrix.tfm }} -name Bs1Cooler.dll | head -1)
          dotnet "$dll" --selftest
