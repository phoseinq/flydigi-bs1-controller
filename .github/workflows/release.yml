name: Release

# Push a tag like v2.0.0: builds the Windows installer and the Linux / macOS archives and attaches them to
# that tag's release. Manual runs (and tags without a release) only keep them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./installer/build.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/out/*.exe

  unix:
    strategy:
      matrix:
        rid: [linux-x64, osx-arm64, osx-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          v=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || v=2.0.0
          dotnet publish app -f net10.0 -r ${{ matrix.rid }} --self-contained true -c Release -p:Version=$v -o out/BS1Cooler
          tar -C out -czf BS1Cooler-$v-${{ matrix.rid }}.tar.gz BS1Cooler
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: '*.tar.gz'

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release itself is created by hand (gh release create) so it stays authored by the owner;
          # without one, the files are only kept as the run's artifacts
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no release $GITHUB_REF_NAME yet: files kept as artifacts"; exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*/* -R "$GITHUB_REPOSITORY" --clobber
