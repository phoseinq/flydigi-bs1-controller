name: Release

# Push a tag like v2.0.0: builds the Windows installer and the Linux / macOS archives and attaches them to
# that tag's release. Manual runs (and tags without a release) only keep them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./installer/build.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/out/*.exe

  libusb:
    # macOS firmware updates go through libusb: built from source as one universal dylib, shipped next to the app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build libusb
        run: |
          v=1.0.27
          curl -fsSL https://github.com/libusb/libusb/releases/download/v$v/libusb-$v.tar.bz2 | tar xj
          for a in arm64 x86_64; do
            mkdir b-$a && (cd b-$a && ../libusb-$v/configure --host=$a-apple-darwin --disable-static -q               CFLAGS="-arch $a -mmacosx-version-min=11.0 -O2" LDFLAGS="-arch $a" && make -j4 -s)
          done
          mkdir libusb
          lipo -create b-arm64/libusb/.libs/libusb-1.0.0.dylib b-x86_64/libusb/.libs/libusb-1.0.0.dylib -output libusb/libusb-1.0.dylib
          install_name_tool -id @rpath/libusb-1.0.dylib libusb/libusb-1.0.dylib
          codesign -s - -f libusb/libusb-1.0.dylib
          cp libusb-$v/COPYING libusb/libusb-COPYING.txt
          lipo -info libusb/libusb-1.0.dylib
      - name: The app loads the bundled copy
        run: |
          dotnet publish app -f net10.0 -r osx-arm64 --self-contained true -c Release -o probe
          cp libusb/libusb-1.0.dylib probe/
          ./probe/Bs1Cooler --usb-probe
      - uses: actions/upload-artifact@v4
        with:
          name: libusb
          path: libusb

  unix:
    needs: libusb
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, osx-arm64, osx-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        if: startsWith(matrix.rid, 'osx')
        with:
          name: libusb
          path: libusb
      - name: Publish
        run: |
          v=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || v=2.0.0
          dotnet publish app -f net10.0 -r ${{ matrix.rid }} --self-contained true -c Release -p:Version=$v -o out/BS1Cooler
          if [ -d libusb ]; then cp libusb/* out/BS1Cooler/; fi
          tar -C out -czf BS1Cooler-$v-${{ matrix.rid }}.tar.gz BS1Cooler
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: deb and rpm packages
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get install -y -qq ruby rpm >/dev/null && sudo gem install --no-document fpm >/dev/null
          # /opt/bs1cooler (the app), a menu entry, the USB rule, and bs1cooler on PATH
          mkdir -p pkg/opt pkg/usr/share/applications pkg/usr/lib/udev/rules.d pkg/usr/bin
          cp -r out/BS1Cooler pkg/opt/bs1cooler
          mv pkg/opt/bs1cooler/99-bs1cooler.rules pkg/usr/lib/udev/rules.d/
          ln -s /opt/bs1cooler/Bs1Cooler pkg/usr/bin/bs1cooler
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=BS1 Cooler' \
            'Comment=Fan and lights for the Flydigi BS1 laptop cooler' 'Exec=/opt/bs1cooler/Bs1Cooler' \
            'Icon=/opt/bs1cooler/cooler.ico' 'Categories=Utility;System;' > pkg/usr/share/applications/bs1cooler.desktop
          printf '%s\n' 'udevadm control --reload >/dev/null 2>&1 || true' 'udevadm trigger >/dev/null 2>&1 || true' > reload-udev.sh
          for t in deb rpm; do
            fpm -s dir -t $t -C pkg -n bs1cooler -v "$VERSION" -a x86_64 --license MIT --url "https://github.com/$GITHUB_REPOSITORY" \
              --description "Fan and lights for the Flydigi BS1 laptop cooler" --maintainer phoseinq \
              --after-install reload-udev.sh --after-remove reload-udev.sh .
          done
          ls -la *.deb *.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            *.tar.gz
            *.deb
            *.rpm

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release itself is created by hand (gh release create) so it stays authored by the owner;
          # without one, the files are only kept as the run's artifacts
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no release $GITHUB_REF_NAME yet: files kept as artifacts"; exit 0
          fi
          rm -rf dist/libusb  # only bundled inside the macOS archives
          gh release upload "$GITHUB_REF_NAME" dist/*/* -R "$GITHUB_REPOSITORY" --clobber
          # a fixed name too, so releases/latest/download/BS1Cooler-Setup.exe always points at the newest installer
          cp dist/windows/BS1Cooler-Setup-*.exe BS1Cooler-Setup.exe
          gh release upload "$GITHUB_REF_NAME" BS1Cooler-Setup.exe -R "$GITHUB_REPOSITORY" --clobber
