    <text x="570" y="347" text-anchor="end" fill="#6E839A" font-size="10" letter-spacing="1.6">FULL SPEED</text>
    <text x="58" y="378" fill="#7891AA" font-size="10" font-weight="600" letter-spacing="2">BLUETOOTH LE<tspan dx="18" fill="#364F68">/</tspan><tspan dx="18">OPEN SOURCE</tspan></text>
  </g>

