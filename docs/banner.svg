<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">Flydigi BS1 Controller</title>
  <desc id="bn-desc">An open-source Windows tray app for fan curve, lights and power control. A silver Flydigi BS1 cooling base glows blue beside a temperature-colored fan curve.</desc>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101925"/><stop offset=".5" stop-color="#080E18"/><stop offset="1" stop-color="#101E33"/>
    </linearGradient>
    <radialGradient id="bn-halo">
      <stop stop-color="#1676CB" stop-opacity=".36"/><stop offset="1" stop-color="#1676CB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-temperature" x1="58" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#347DFF"/><stop offset=".3" stop-color="#34E0F2"/><stop offset=".55" stop-color="#70ECA5"/><stop offset=".78" stop-color="#FFE47C"/><stop offset="1" stop-color="#FF646C"/>
    </linearGradient>
    <linearGradient id="bn-curve-fill" x1="0" y1="245" x2="0" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D4F4" stop-opacity=".13"/><stop offset="1" stop-color="#39D4F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bn-aluminum" x1="0" y1="0" x2="500" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F5FA"/><stop offset=".17" stop-color="#9CAABA"/><stop offset=".43" stop-color="#E1E8F0"/><stop offset=".7" stop-color="#8795A6"/><stop offset="1" stop-color="#EAF2F8"/>
    </linearGradient>
    <linearGradient id="bn-front" x1="790" y1="266" x2="793" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9E4ED"/><stop offset=".3" stop-color="#A6B5C4"/><stop offset=".38" stop-color="#CFD9E2"/><stop offset=".48" stop-color="#8796A7"/><stop offset="1" stop-color="#536172"/>
    </linearGradient>
    <linearGradient id="bn-side" x1="683" y1="159" x2="785" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7B6C8"/><stop offset=".25" stop-color="#46566B"/><stop offset=".75" stop-color="#1D2C40"/><stop offset="1" stop-color="#8395A9"/>
    </linearGradient>
    <linearGradient id="bn-foam" x1="30" y1="10" x2="470" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39424A"/><stop offset=".48" stop-color="#222B34"/><stop offset="1" stop-color="#121A24"/>
    </linearGradient>
    <linearGradient id="bn-intake" x1="70" y1="40" x2="430" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#103873"/><stop offset=".35" stop-color="#257CF2"/><stop offset=".62" stop-color="#165AD2"/><stop offset="1" stop-color="#4CCCF8"/>
    </linearGradient>
    <radialGradient id="bn-fan">
      <stop stop-color="#319DF5"/><stop offset=".48" stop-color="#175CAF"/><stop offset=".8" stop-color="#0B2852"/><stop offset="1" stop-color="#08192E"/>
    </radialGradient>
    <linearGradient id="bn-blade-fill" x1="225" y1="76" x2="271" y2="147" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81D8FF"/><stop offset=".48" stop-color="#388FDA"/><stop offset="1" stop-color="#123765"/>
    </linearGradient>
    <linearGradient id="bn-hub" x1="217" y1="111" x2="280" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BC8FF"/><stop offset=".45" stop-color="#278FE4"/><stop offset="1" stop-color="#1251B8"/>
    </linearGradient>
    <pattern id="bn-mesh" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#132A40"/>
      <circle cx="2" cy="2" r="1.25" fill="#69ABD1" opacity=".65"/>
      <circle cx="5.5" cy="5.5" r="1.1" fill="#050D18"/>
    </pattern>
    <pattern id="bn-grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".65" fill="#CFDDEA" opacity=".12"/>
      <circle cx="4" cy="5" r=".8" fill="#000" opacity=".2"/>
    </pattern>
    <filter id="bn-glow" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bn-shadow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
